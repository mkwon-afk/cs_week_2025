<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Week 2025 Email Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .email-banner {
            width: 600px;
            height: 300px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1b 50%, #991b1b 100%);
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .banner-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.1) 2px, transparent 2px),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 2px, transparent 2px),
                radial-gradient(circle at 40% 60%, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px, 60px 60px, 30px 30px;
        }
        
        .banner-content {
            position: relative;
            z-index: 2;
            padding: 30px;
        }
        
        .celebration {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .main-title {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #fef3c7;
            font-weight: 600;
        }
        
        .event-dates {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
        }
        
        .winners-badge {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1f2937;
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
        }
        
        .red-hat-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            opacity: 0.8;
        }
        
        /* Static version for email compatibility */
        .email-banner.static .banner-pattern {
            animation: none;
        }
        
        .email-banner.static .celebration,
        .email-banner.static .main-title,
        .email-banner.static .subtitle,
        .email-banner.static .event-dates,
        .email-banner.static .winners-badge {
            animation: none;
        }
    </style>
</head>
<body>
    <div class="email-banner static">
        <div class="banner-pattern"></div>
        <div class="red-hat-icon">🔴</div>
        
        <div class="banner-content">
            <div class="celebration">🎉 🏆 🎊</div>
            
            <h1 class="main-title">CS Week 2025</h1>
            <h2 class="subtitle">Winners Announced!</h2>
            
            <div class="event-dates">
                📅 October 6-10, 2025 • Event Complete
            </div>
            
            <div class="winners-badge">
                🎯 Lucky Draw Winners & Special Awards
            </div>
        </div>
    </div>
</body>
</html>
